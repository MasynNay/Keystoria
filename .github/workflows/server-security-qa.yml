name: Validate Local Co-op Security

on:
  pull_request:
    paths:
      - 'app/server/**'
      - 'app/tests/test_api.py'
      - 'app/tests/test_server_network_security.py'
      - 'app/tests/test_engine.py'
      - 'app/tests/test_field_websocket.py'
      - 'app/tests/test_launch_socket_v014.py'
      - 'app/requirements.txt'
      - 'app/Dockerfile'
      - 'app/README.md'
      - 'app/web/app.js'
      - 'app/web/index.html'
      - 'app/web/ui/views.js'
      - 'app/web/ui/session-recovery.js'
      - 'app/web/styles/session-recovery.css'
      - 'app/tests/test_session_recovery.mjs'
      - 'scripts/test-session-recovery-browser.mjs'
      - 'docs/COOP-HOSTING-DECISION.md'
      - '.github/workflows/server-security-qa.yml'
  push:
    branches: [main]
    paths:
      - 'app/server/**'
      - 'app/tests/test_api.py'
      - 'app/tests/test_server_network_security.py'
      - 'app/tests/test_engine.py'
      - 'app/tests/test_field_websocket.py'
      - 'app/tests/test_launch_socket_v014.py'
      - 'app/requirements.txt'
      - 'app/Dockerfile'
      - 'app/README.md'
      - 'app/web/app.js'
      - 'app/web/index.html'
      - 'app/web/ui/views.js'
      - 'app/web/ui/session-recovery.js'
      - 'app/web/styles/session-recovery.css'
      - 'app/tests/test_session_recovery.mjs'
      - 'scripts/test-session-recovery-browser.mjs'
      - 'docs/COOP-HOSTING-DECISION.md'
      - '.github/workflows/server-security-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reconnect recovery frontend
        run: |
          node --check app/web/app.js
          node --check app/web/ui/session-recovery.js
          node --test app/tests/test_session_recovery.mjs
      - name: Install Chromium for real recovery UI regressions
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps --only-shell chromium
      - name: Check browser recovery interactions and keyboard focus
        run: node scripts/test-session-recovery-browser.mjs
      - name: Install local server dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Check Python modules
        run: python -m compileall -q app/server app/tests/test_server_network_security.py
      - name: Run local network and WebSocket security regressions
        working-directory: app
        run: |
          python -m unittest discover -s tests -p 'test_engine.py' -v
          python -m unittest discover -s tests -p 'test_server_network_security.py' -v
          python -m unittest discover -s tests -p 'test_api.py' -v
          python -m unittest discover -s tests -p 'test_launch_socket_v014.py' -v
          python -m unittest discover -s tests -p 'test_field_websocket.py' -v
