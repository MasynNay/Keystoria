name: Validate Mobile Typing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-qa.yml'
      - 'app/web/**'
      - 'site/play/**'
      - 'app/tests/test_mobile_typing.mjs'
      - 'scripts/test-mobile-typing.mjs'
      - 'scripts/test-speed-mobile-performance.mjs'
      - 'scripts/test-speed-keyboard-assist.mjs'
      - 'scripts/test-numpad-browser.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-qa.yml'
      - 'app/web/**'
      - 'site/play/**'
      - 'app/tests/test_mobile_typing.mjs'
      - 'scripts/test-mobile-typing.mjs'
      - 'scripts/test-speed-mobile-performance.mjs'
      - 'scripts/test-speed-keyboard-assist.mjs'
      - 'scripts/test-numpad-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-typing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and pure mobile helpers
        run: |
          node --check app/web/app.js
          node --check site/play/assets/app.js
          node --check app/web/ui/mobile-typing.js
          node --check site/play/assets/ui/mobile-typing.js
          node --check app/web/ui/lyric-lab-controller.js
          node --check site/play/assets/ui/lyric-lab-controller.js
          node --check app/web/ui/training-view.js
          node --check site/play/assets/ui/training-view.js
          node --test app/tests/test_mobile_typing.mjs app/tests/test_lyric_word_feedback.mjs app/tests/test_numpad.mjs
          diff app/web/ui/mobile-typing.js site/play/assets/ui/mobile-typing.js
          diff app/web/styles/mobile-typing.css site/play/assets/styles/mobile-typing.css
          diff app/web/ui/speed-controller.js site/play/assets/ui/speed-controller.js
          diff app/web/ui/speed-flow.js site/play/assets/ui/speed-flow.js
          diff app/web/ui/speed-engine.js site/play/assets/ui/speed-engine.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Serve portfolio app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/keystoria-mobile.log 2>&1 &
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/play/ >/dev/null
      - name: Exercise three modes in mobile and desktop widths
        run: |
          node scripts/test-mobile-typing.mjs
          node scripts/test-speed-mobile-performance.mjs
          node scripts/test-speed-keyboard-assist.mjs
          node scripts/test-numpad-browser.mjs
