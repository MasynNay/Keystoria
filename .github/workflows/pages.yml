name: Deploy Keystoria portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keystoria-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript, scoring, and shared browser modules
        run: |
          node --check scripts/test-release-browser.mjs
          node --check scripts/test-speed-history-restore.mjs
          node scripts/test-speed-incremental-score.mjs
          node --check site/play/assets/app.js
          node --check app/web/app.js
          node --check site/play/assets/ui/performance-check.js
          node --test app/tests/test_performance_check.mjs
          node --check app/web/ui/session-recovery.js
          node --test app/tests/test_session_recovery.mjs
          node --test app/tests/test_lessons.mjs
          diff app/web/ui/lessons.js site/play/assets/ui/lessons.js
          diff app/web/ui/lesson-output.js site/play/assets/ui/lesson-output.js
          diff app/web/ui/command-guides.js site/play/assets/ui/command-guides.js
          node --test app/tests/test_academy_checkpoint.mjs app/tests/test_lyric_word_feedback.mjs app/tests/test_lyric_history.mjs app/tests/test_mobile_typing.mjs app/tests/test_numpad.mjs app/tests/test_vocabulary.mjs app/tests/test_lyric_provider.mjs app/tests/test_video_match.mjs app/tests/test_theme_contrast.mjs app/tests/test_speed_insights.mjs app/tests/test_speed_activity.mjs app/tests/test_speed_history_restore.mjs
          diff app/web/ui/academy-checkpoint.js site/play/assets/ui/academy-checkpoint.js
          diff app/web/styles.css site/play/assets/styles.css
          diff app/web/styles/mobile-typing.css site/play/assets/styles/mobile-typing.css
          diff app/web/styles/v020.css site/play/assets/styles/v020.css
          diff app/web/styles/performance-check.css site/play/assets/styles/performance-check.css
          diff app/web/ui/performance-check.js site/play/assets/ui/performance-check.js
          diff app/web/ui/lyric-lab-core.js site/play/assets/ui/lyric-lab-core.js
          diff app/web/ui/lyric-history.js site/play/assets/ui/lyric-history.js
          diff app/web/styles/v018.css site/play/assets/styles/v018.css
          diff app/web/ui/speed-engine.js site/play/assets/ui/speed-engine.js
          diff app/web/ui/speed-flow.js site/play/assets/ui/speed-flow.js
          diff app/web/ui/speed-controller.js site/play/assets/ui/speed-controller.js
          diff app/web/ui/speed-insights.js site/play/assets/ui/speed-insights.js
          diff app/web/ui/mobile-typing.js site/play/assets/ui/mobile-typing.js
          diff app/web/ui/typing-feedback.js site/play/assets/ui/typing-feedback.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps --only-shell chromium
      - name: Serve the exact Pages source folder
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/keystoria-release.log 2>&1 &
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ >/dev/null
      - name: Block release if portfolio or gameplay fails
        run: |
          node scripts/test-release-browser.mjs
          node scripts/test-release-negative.mjs
          node scripts/test-vocabulary-browser.mjs
          node scripts/test-lyric-races.mjs
          node scripts/test-dialog-keyboard.mjs
          node scripts/test-navigation-accessibility.mjs
          node scripts/test-mobile-viewport-recovery.mjs
          node scripts/test-story-mobile-keyboard.mjs
          node scripts/test-mobile-compositor.mjs
          node scripts/test-session-recovery-browser.mjs
          node scripts/test-academy-focus.mjs
          node scripts/test-lyric-completion.mjs
          node scripts/test-lyric-tick-compositor.mjs
          node scripts/test-lyric-idle-scheduler.mjs
          node scripts/test-lyric-history-browser.mjs
          node scripts/test-practice-composition.mjs
          node scripts/test-speed-mobile-performance.mjs
          node scripts/test-speed-idle-ticks.mjs
          node scripts/test-speed-caret-bursts.mjs
          node scripts/test-performance-check.mjs
          node scripts/test-typing-dom-performance.mjs
          node scripts/test-native-input-layout-budget.mjs
          node scripts/test-cinematic-progress-dom.mjs
          node scripts/test-speed-interruption.mjs
          node scripts/test-speed-keyboard-assist.mjs
          node scripts/test-speed-word-focus.mjs
          node scripts/test-speed-insights-browser.mjs
          node scripts/test-speed-history-restore.mjs

  deploy:
    needs: browser-regression
    # A PR can test a release, but only main may publish the portfolio.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify portfolio assets
        run: |
          test -f docs/ROADMAP.md
          test -f .gitattributes
          test -f docs/screenshots/current/browser-home-desktop.png
          test -f docs/screenshots/current/lyric-lab-desktop.png
          test -f docs/screenshots/current/speed-lab-desktop.png
          test -f docs/screenshots/current/field-academy-desktop.png
          test -f site/index.html
          grep -q 'id="roadmap"' site/index.html
          grep -q 'docs/ROADMAP.md' README.md
          test -f site/play/index.html
          test -f site/play/assets/app.js
          test -f site/play/assets/ui/views.js
          test -f site/play/assets/ui/lyric-lab-controller.js
          node --check site/play/assets/app.js
          node --check site/play/assets/ui/views.js
          node --check site/play/assets/ui/lyric-lab-controller.js
          node --test app/tests/test_lyric_word_feedback.mjs
          diff app/web/ui/academy-checkpoint.js site/play/assets/ui/academy-checkpoint.js
          diff app/web/styles.css site/play/assets/styles.css
          diff app/web/styles/mobile-typing.css site/play/assets/styles/mobile-typing.css
          diff app/web/styles/v020.css site/play/assets/styles/v020.css
          diff app/web/styles/performance-check.css site/play/assets/styles/performance-check.css
          diff app/web/ui/performance-check.js site/play/assets/ui/performance-check.js
          diff app/web/ui/lyric-lab-core.js site/play/assets/ui/lyric-lab-core.js
          diff app/web/ui/lyric-history.js site/play/assets/ui/lyric-history.js
          diff app/web/styles/v018.css site/play/assets/styles/v018.css
          test -f site/styles.css
          test -f site/.nojekyll
          test -f site/assets/keystoria-mark.svg
          test -f site/assets/keystoria-home-desktop-v024.png
          test -f site/assets/lyric-next-key-desktop-v023.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static portfolio
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # GitHub occasionally finalizes an upload before the Actions list API
      # indexes it. deploy-pages reads the list immediately and can see zero
      # artifacts even though upload-pages-artifact has succeeded (#88).
      # Check the exact artifact ID from this attempt, not a stale retry.
      - name: Wait for indexed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          test -n "$PAGES_ARTIFACT_ID"
          for attempt in $(seq 1 20); do
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | "\(.id):\(.name)"' 2>/dev/null || true)"
            if printf '%s\n' "$artifacts" | grep -Fxq "${PAGES_ARTIFACT_ID}:github-pages"; then
              echo "Pages artifact ${PAGES_ARTIFACT_ID} is indexed (attempt ${attempt})."
              # Give deploy-pages' independent metadata request a small
              # propagation window after the first successful index read.
              sleep 5
              exit 0
            fi
            echo "Artifact not indexed yet (check ${attempt}/20)."
            sleep 3
          done
          echo "::error::Uploaded Pages artifact ${PAGES_ARTIFACT_ID} not indexed after 20 checks."
          exit 1
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
