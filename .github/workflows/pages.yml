name: Deploy Keystoria portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keystoria-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript, scoring, and shared browser modules
        run: |
          node --check scripts/test-release-browser.mjs
          node --check site/play/assets/app.js
          node --check app/web/app.js
          node --test app/tests/test_lyric_word_feedback.mjs app/tests/test_mobile_typing.mjs app/tests/test_numpad.mjs app/tests/test_vocabulary.mjs app/tests/test_lyric_provider.mjs app/tests/test_video_match.mjs app/tests/test_theme_contrast.mjs
          diff app/web/ui/lyric-lab-core.js site/play/assets/ui/lyric-lab-core.js
          diff app/web/ui/speed-engine.js site/play/assets/ui/speed-engine.js
          diff app/web/ui/speed-flow.js site/play/assets/ui/speed-flow.js
          diff app/web/ui/speed-controller.js site/play/assets/ui/speed-controller.js
          diff app/web/ui/mobile-typing.js site/play/assets/ui/mobile-typing.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Serve the exact Pages source folder
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/keystoria-release.log 2>&1 &
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ >/dev/null
      - name: Block release if portfolio or gameplay fails
        run: |
          node scripts/test-release-browser.mjs
          node scripts/test-release-negative.mjs
          node scripts/test-vocabulary-browser.mjs
          node scripts/test-lyric-races.mjs
          node scripts/test-dialog-keyboard.mjs
          node scripts/test-navigation-accessibility.mjs
          node scripts/test-speed-mobile-performance.mjs
          node scripts/test-speed-keyboard-assist.mjs

  deploy:
    needs: browser-regression
    # A PR can test a release, but only main may publish the portfolio.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify portfolio assets
        run: |
          test -f docs/ROADMAP.md
          test -f .gitattributes
          test -f docs/screenshots/current/browser-home-desktop.png
          test -f docs/screenshots/current/lyric-lab-desktop.png
          test -f docs/screenshots/current/speed-lab-desktop.png
          test -f docs/screenshots/current/field-academy-desktop.png
          test -f site/index.html
          grep -q 'id="roadmap"' site/index.html
          grep -q 'docs/ROADMAP.md' README.md
          test -f site/play/index.html
          test -f site/play/assets/app.js
          test -f site/play/assets/ui/views.js
          test -f site/play/assets/ui/lyric-lab-controller.js
          node --check site/play/assets/app.js
          node --check site/play/assets/ui/views.js
          node --check site/play/assets/ui/lyric-lab-controller.js
          node --test app/tests/test_lyric_word_feedback.mjs
          diff app/web/ui/lyric-lab-core.js site/play/assets/ui/lyric-lab-core.js
          test -f site/styles.css
          test -f site/.nojekyll
          test -f site/assets/keystoria-mark.svg
          test -f site/assets/keystoria-home-desktop-v024.png
          test -f site/assets/lyric-next-key-desktop-v023.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
