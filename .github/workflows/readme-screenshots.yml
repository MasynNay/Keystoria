name: Refresh README screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-screenshots.yml'
      - 'scripts/capture-readme-screenshots.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start the actual static browser edition
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/keystoria-site.log 2>&1 &
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/play/ > /dev/null
      - name: Capture verified app views
        run: node scripts/capture-readme-screenshots.mjs
      - name: Commit screenshot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/current/ site/assets/keystoria-browser-home-current.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: capture current Keystoria app screenshots"
            git push origin HEAD:main
          fi
