name: Validate Numpad Challenge
on:
  push:
    branches: [feature/speed-lab-numpad-2026-11-09]
  pull_request:
    paths:
      - 'app/web/ui/speed-*'
      - 'site/play/assets/ui/speed-*'
      - 'app/tests/test_numpad.mjs'
      - '.github/workflows/numpad-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numpad:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Serve static edition
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/keystoria-numpad.log 2>&1 &
          curl --fail --silent --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/play/ >/dev/null
      - name: Browser regression
        run: node scripts/test-numpad-browser.mjs
      - name: Check code and numeric scoring
        run: |
          node --check app/web/app.js
          node --check site/play/assets/app.js
          node --check app/web/ui/speed-controller.js
          node --check app/web/ui/speed-view.js
          node --test app/tests/test_numpad.mjs
          diff app/web/ui/speed-engine.js site/play/assets/ui/speed-engine.js
          diff app/web/ui/speed-controller.js site/play/assets/ui/speed-controller.js
          diff app/web/styles/speed.css site/play/assets/styles/speed.css
